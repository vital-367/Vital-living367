ction history(){$('records').replaceChildren();let records=read();if(!records.length)$('records').textContent=t(21);records.slice().reverse().forEach(r=>{let p=document.createElement('p');p.textContent=r.date+' · '+r.total+'/125 · '+(r.total/125*100).toFixed(1)+'%';$('records').append(p)})}$('lang').onchange=()=>{l=Number($('lang').value);render()};$('start').onclick=()=>$('quiz').scrollIntoView({behavior:'smooth'});$('date').onchange=()=>{last=null;$('result').hidden=true};$('calc').onclick=()=>{let missing=answers.indexOf(0);if(missing>=0){alert(t(13)+(missing+1)+t(14));document.querySelectorAll('fieldset')[missing].scrollIntoView();return}if(!$('date').reportValidity()||!$('date').value){$('date').focus();return}let scores=G[l].map((_,i)=>answers.slice(i*5,i*5+5).reduce((a,b)=>a+(i===4?6-b:b),0));last={date:$('date').value,scores,total:scores.reduce((a,b)=>a+b,0)};show();$('result').scrollIntoView({behavior:'smooth'})};$('save').onclick=()=>{if(!last||last.saved)return;try{localStorage.setItem(key,JSON.stringify([...read(),last]));last.saved=true;$('save').disabled=true;history();alert(t(15))}catch(e){alert(t(22))}};$('clear').onclick=()=>{if(confirm(t(16))){try{localStorage.removeItem(key);history()}catch(e){alert(t(22))}}};$('print').onclick=()=>window.print();render();</script></html>
